<svg xmlns="http://www.w3.org/2000/svg" viewBox="-700 -700 20200 13400" role="img" aria-label="План клубу nøx: обведені й підписані санвузол, гардероб і танцпол 7,35 × 12 м; унизу барна стійка 4,1 м, у залі шість колон, сцена біля правої стіни, ліворуч угорі staff room">
  <rect x="0" y="0" width="18000" height="12000" fill="#06070A"/>
  <defs>
  <radialGradient id="floorlight" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#2E9BF0" stop-opacity=".20"/>
  <stop offset=".55" stop-color="#2E9BF0" stop-opacity=".07"/>
  <stop offset="1" stop-color="#2E9BF0" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <ellipse cx="5450" cy="5750" rx="5300" ry="2750" fill="url(#floorlight)"/>
  <path d="M0,0H18000V12000H0Z M250,250H17750V11750H250Z" fill-rule="evenodd" fill="#E9E4D8"/>
  <rect x="0" y="2950" width="10650" height="150" fill="#E9E4D8"/>
  <rect x="10490" y="250" width="160" height="2700" fill="#E9E4D8"/>
  <rect x="2500" y="250" width="150" height="2700" fill="#E9E4D8"/>
  <rect x="10700" y="9072" width="160" height="2678" fill="#E9E4D8"/>
  <rect x="9295" y="1045" width="160" height="1905" fill="#E9E4D8"/>
  <rect x="780" y="2950" width="820" height="150" fill="#06070A"/>
  <rect x="3030" y="2950" width="820" height="150" fill="#06070A"/>
  <rect x="8470" y="2950" width="820" height="150" fill="#06070A"/>
  <rect x="0" y="4500" width="250" height="1400" fill="#06070A"/>
  <g fill="#E9E4D8" fill-opacity=".12" stroke="#2E9BF0" stroke-width="24">
  <rect x="2650" y="250" width="800" height="1300"/><rect x="3540" y="250" width="800" height="1300"/><rect x="4395" y="250" width="800" height="1300"/>
  <rect x="5270" y="250" width="800" height="1300"/><rect x="6135" y="250" width="800" height="1300"/><rect x="7010" y="250" width="800" height="1300"/>
  </g>
  <g fill="#2E9BF0" fill-opacity=".62" stroke="none">
  <rect x="2825" y="331" width="450" height="550"/><rect x="3715" y="331" width="450" height="550"/><rect x="4570" y="331" width="450" height="550"/>
  <rect x="5445" y="331" width="450" height="550"/><rect x="6310" y="331" width="450" height="550"/><rect x="7185" y="331" width="450" height="550"/>
  </g>
  <g fill="#7FD4FF" fill-opacity=".55" stroke="#7FD4FF" stroke-width="26">
  <rect x="10267" y="882" width="223" height="427"/>
  <rect x="10267" y="1831" width="223" height="427"/>
  </g>
  <g fill="#2E9BF0" fill-opacity=".34" stroke="#2E9BF0" stroke-width="24">
  <rect x="4570" y="2590" width="450" height="360"/><rect x="5550" y="2590" width="450" height="360"/>
  <rect x="6530" y="2590" width="450" height="360"/><rect x="7510" y="2590" width="450" height="360"/>
  </g>
  <!-- Предмет без підпису в кресленні, біля стіни санвузла. Намальований,
       але не названий. -->
  <g fill="#E9E4D8" fill-opacity=".10" stroke="#6B665C" stroke-width="24">
  <rect x="10730" y="2550" width="1470" height="430"/>
  </g>
  <!-- Сцена окремою групою, як і гардероб: на сайті fx.js вирізає її й малює
       один із двох сетапів. Тут перший — сцена біля правої стіни, колонки в
       правих кутах, повернуті до середини танцполу. -->
  <g id="stage">
  <path d="M-289 695A450 450 0 0 1 289 695" transform="translate(17050 1000) rotate(29.7)" fill="none" stroke="#2E9BF0" stroke-opacity=".55" stroke-width="40" stroke-linecap="round"/>
  <path d="M-514 963A800 800 0 0 1 514 963" transform="translate(17050 1000) rotate(29.7)" fill="none" stroke="#2E9BF0" stroke-opacity=".34" stroke-width="40" stroke-linecap="round"/>
  <path d="M-739 1231A1150 1150 0 0 1 739 1231" transform="translate(17050 1000) rotate(29.7)" fill="none" stroke="#2E9BF0" stroke-opacity=".18" stroke-width="40" stroke-linecap="round"/>
  <rect x="-400" y="-350" width="800" height="700" transform="translate(17050 1000) rotate(29.7)" fill="#E9E4D8" fill-opacity=".16" stroke="#E9E4D8" stroke-opacity=".7" stroke-width="24"/>
  <line x1="-400" y1="350" x2="400" y2="350" transform="translate(17050 1000) rotate(29.7)" stroke="#7FD4FF" stroke-width="70"/>
  <path d="M-289 695A450 450 0 0 1 289 695" transform="translate(17050 11000) rotate(150.3)" fill="none" stroke="#2E9BF0" stroke-opacity=".55" stroke-width="40" stroke-linecap="round"/>
  <path d="M-514 963A800 800 0 0 1 514 963" transform="translate(17050 11000) rotate(150.3)" fill="none" stroke="#2E9BF0" stroke-opacity=".34" stroke-width="40" stroke-linecap="round"/>
  <path d="M-739 1231A1150 1150 0 0 1 739 1231" transform="translate(17050 11000) rotate(150.3)" fill="none" stroke="#2E9BF0" stroke-opacity=".18" stroke-width="40" stroke-linecap="round"/>
  <rect x="-400" y="-350" width="800" height="700" transform="translate(17050 11000) rotate(150.3)" fill="#E9E4D8" fill-opacity=".16" stroke="#E9E4D8" stroke-opacity=".7" stroke-width="24"/>
  <line x1="-400" y1="350" x2="400" y2="350" transform="translate(17050 11000) rotate(150.3)" stroke="#7FD4FF" stroke-width="70"/>
  <rect x="16142" y="4635" width="990" height="2990" fill="#2E9BF0" fill-opacity=".2" stroke="#B9E2FF" stroke-width="26"/>
  <text x="16637" y="6250" transform="rotate(-90 16637 6130)" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="340" letter-spacing="40" fill="#B9E2FF">СЦЕНА</text>
  </g>
  <rect x="6600" y="9375" width="4100" height="450" fill="#B9E2FF" fill-opacity=".30" stroke="#B9E2FF" stroke-width="26"/>
  <g stroke="#B9E2FF" stroke-width="26">
  <rect x="6600" y="9750" width="1500" height="600" fill="#2E9BF0" fill-opacity=".30"/>
  <rect x="8100" y="9750" width="1100" height="600" fill="#B9E2FF" fill-opacity=".30"/>
  <rect x="9200" y="9750" width="1500" height="600" fill="#2E9BF0" fill-opacity=".30"/>
  </g>
  <g stroke="#B9E2FF" stroke-width="26">
  <rect x="6600" y="11190" width="590" height="560" fill="#2E9BF0" fill-opacity=".45"/>
  <rect x="7190" y="11341" width="1005" height="409" fill="#B9E2FF" fill-opacity=".45"/>
  <rect x="8195" y="11190" width="910" height="560" fill="#2E9BF0" fill-opacity=".45"/>
  <rect x="9105" y="11341" width="1005" height="409" fill="#B9E2FF" fill-opacity=".45"/>
  <rect x="10110" y="11190" width="590" height="560" fill="#2E9BF0" fill-opacity=".45"/>
  </g>
  <!-- Гардероб окремою групою: на сайті fx.js вирізає її з картинки й малює
       гардероб наново поверх, живим, — його можна тягнути за верхній край.
       Тут він такий, як у кресленні: 2,50 × 2,20 м. -->
  <g id="cloakroom">
  <rect x="250" y="9550" width="2500" height="2200" fill="#B9E2FF" fill-opacity=".18"
  stroke="#B9E2FF" stroke-width="26" stroke-dasharray="220 140"/>
  <text x="1500" y="10780" text-anchor="middle" fill="#B9E2FF" font-family="ui-monospace, Menlo, monospace" font-size="360" letter-spacing="30">ГАРДЕРОБ</text>
  </g>
  <!-- Обведені зони. Гардероб уже мав свій контур нижче ліворуч; тут два
       інші: санвузол угорі (шість кабін, до внутрішньої стіни на 9295) і
       танцпол — уся права частина, 7350 × 12000 мм за кресленням. -->
  <g fill="none" stroke="#B9E2FF" stroke-width="26" stroke-dasharray="220 140" opacity=".72">
  <rect x="2650" y="250" width="6645" height="2700"/>
  <rect x="10650" y="250" width="7100" height="11500"/>
  </g>
  <g fill="#E9E4D8" stroke="none">
  <rect x="3090" y="5950" width="320" height="360"/><rect x="4550" y="5950" width="320" height="360"/>
  <rect x="6030" y="5950" width="320" height="360"/><rect x="7490" y="5950" width="320" height="360"/>
  <rect x="8950" y="5950" width="320" height="360"/><rect x="10430" y="5950" width="320" height="360"/>
  </g>
  <g fill="none" stroke="#2E9BF0" stroke-width="46" stroke-dasharray="200 120" opacity=".95">
  <rect x="6430" y="9215" width="4330" height="2575" rx="170"/>
  </g>
  <g text-anchor="middle" fill="#B9E2FF" font-family="ui-monospace, Menlo, monospace">
  <text x="5970" y="2400" font-size="420" letter-spacing="46">САНВУЗОЛ</text>
  <text x="1375" y="1450" font-size="360" letter-spacing="30">STAFF</text>
  <text x="1375" y="1900" font-size="360" letter-spacing="30">ROOM</text>
  <text x="13900" y="5820" font-size="760" letter-spacing="96">ТАНЦПОЛ</text>
  <text x="13900" y="6280" font-size="300" letter-spacing="28" opacity=".72">7,35 × 12 м · 88,2 м²</text>
  </g>
  <g text-anchor="middle" fill="#2E9BF0">
  <text x="8650" y="8760" font-family="ui-monospace, Menlo, monospace"
  font-size="700" letter-spacing="90">БАР</text>
  <text x="8650" y="9130" font-family="ui-monospace, Menlo, monospace"
  font-size="300" letter-spacing="28" opacity=".8">4,1 м стійки</text>
  </g>
  <g stroke="#6B665C" stroke-width="24" fill="none">
  <line x1="0" y1="-330" x2="18000" y2="-330"/>
  <line x1="18330" y1="0" x2="18330" y2="12000"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="290" fill="#6B665C" text-anchor="middle">
  <text x="9000" y="-450">18,00 м</text>
  <text x="18800" y="6000" transform="rotate(-90 18800 6000)">12,00 м</text>
  </g>
  </svg>
