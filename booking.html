<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оренда майданчика — nøx</title>
<meta name="description" content="Оренда nøx під ваш вечір: зал 215 м² на 300–350 гостей, бар 9,6 м, гардероб, тераса, парковка. План залу і заявка на дату.">
<meta name="theme-color" content="#06070A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nøx">
<meta property="og:title" content="Оренда майданчика — nøx">
<meta property="og:description" content="Зал 215 м² на 300–350 гостей під ваш вечір. Нижньоюрківська, 31.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="wave" aria-hidden="true"></canvas>
<div class="film" aria-hidden="true"></div>
<div class="burn" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="bar stuck" id="bar">
  <a class="wm" href="/"><img src="/assets/logo.svg" alt="" width="26" height="26"><span>nøx</span></a>
  <nav>
    <a href="/">Головна</a>
    <a href="/events">Афіша</a>
    <a class="cta" href="/booking" aria-current="page">Забронювати</a>
  </nav>
</div>

<main>

  <header class="phead">
    <div class="inner">
      <p class="mark">Оренда</p>
      <h1>Ваш вечір<br>у цьому залі</h1>
      <p class="lead">Зал на 300–350 гостей. Розкажіть про дату — відповімо, чи вільна, і що можемо взяти на себе.</p>
    </div>
  </header>

  <section id="dati">
    <div class="inner">
      <div class="book rise">
        <form id="rentform" autocomplete="on">
          <div class="fields">
            <div class="f">
              <label for="r-name">Хто ви <span>*</span></label>
              <input id="r-name" name="name" required maxlength="200" placeholder="Імʼя або назва команди">
            </div>
            <div class="f">
              <label for="r-contact">Звʼязок <span>*</span></label>
              <input id="r-contact" name="contact" required maxlength="200" placeholder="Telegram, телефон або пошта">
            </div>
            <div class="f">
              <label for="r-date">Дата <span>*</span></label>
              <input id="r-date" name="date" type="date" required>
            </div>
            <div class="f">
              <label for="r-guests">Скільки гостей чекаєте</label>
              <input id="r-guests" name="guests" maxlength="200" placeholder="200–300">
            </div>
            <div class="f wide">
              <label for="r-event">Що за вечір</label>
              <input id="r-event" name="event" maxlength="200" placeholder="Назва, формат, музика">
            </div>
            <div class="f wide">
              <label for="r-comment">Що потрібно від нас</label>
              <textarea id="r-comment" name="comment" maxlength="2000" placeholder="Звук, світло, бармени, тайминг"></textarea>
            </div>
          </div>
          <div class="hp" aria-hidden="true">
            <label for="r-website">Не заповнюйте</label>
            <input id="r-website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <div class="formfoot">
            <button class="btn" type="submit" id="rentbtn">Надіслати</button>
            <span class="msg" id="rentmsg" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>
    </div>
  </section>

</main>

<script src="/assets/fx.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
