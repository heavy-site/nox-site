---
deployment:
  tasks:
    # Docroot, taken from the account the deploy is actually running under.
    # It used to be written out as /home3/hevycom/nox.he4vy.com/ — a path on a
    # different cPanel account — so every deploy wrote where it had no business
    # writing, the repository updated and the site never changed. $HOME follows
    # whichever account holds the repository, so it cannot drift again.
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH $DEPLOYPATH/api $DEPLOYPATH/fonts $DEPLOYPATH/assets $DEPLOYPATH/media
    - /bin/cp    ./index.html      $DEPLOYPATH
    - /bin/cp    ./events.html     $DEPLOYPATH
    - /bin/cp    ./booking.html    $DEPLOYPATH
    - /bin/cp    ./favicon.svg     $DEPLOYPATH
    - /bin/cp    ./.htaccess       $DEPLOYPATH
    - /bin/cp -R ./api/.           $DEPLOYPATH/api/
    - /bin/cp -R ./fonts/.         $DEPLOYPATH/fonts/
    - /bin/cp -R ./assets/.        $DEPLOYPATH/assets/
    - /bin/cp -R ./media/.         $DEPLOYPATH/media/
    - /bin/rm -f $DEPLOYPATH/api/config.sample.php
